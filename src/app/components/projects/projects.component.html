<div class="row mx-0 py-2 tile-card ubuntu-font">
     <div class="d-flex align-items-center gap-2 mb-2">
         <i class="fa-solid fa-toolbox"></i>
        <p class="small mb-0 font-bold">Recent Projects</p>
    </div>

    <div class="row g-3 px-3 pb-3 m-0">
        @for (item of projects; track item.id) {
        <div class="project-card col-12 col-sm-6">
            <div class="card h-100 bento-card">
                <div class="card-body p-3">
                    <a href="{{ item.link }}" target="_blank" class="text-decoration-none d-block">
                        <h5 class="card-title fs-6 fw-semibold mb-2">{{ item.name }}</h5>
                        <p class="card-text small text-muted mb-2">{{ item.description }}</p>
                        <span class="badge bg-light text-muted font-monospace small mt-1">{{ item.site }}</span>
                    </a>
                </div>
            </div>
        </div>
        }
    </div>
</div>
