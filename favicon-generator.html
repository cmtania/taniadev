<!DOCTYPE html>
<html>
<head>
    <title>Favicon Generator</title>
</head>
<body>
    <h2>CT Favicon Generator</h2>
    <canvas id="canvas16" width="16" height="16" style="border: 1px solid #ccc; margin: 5px;"></canvas>
    <canvas id="canvas32" width="32" height="32" style="border: 1px solid #ccc; margin: 5px;"></canvas>
    <canvas id="canvas48" width="48" height="48" style="border: 1px solid #ccc; margin: 5px;"></canvas>
    <br>
    <button onclick="generateFavicons()">Generate Favicons</button>
    <div id="download-links"></div>

    <script>
        function drawCTLogo(ctx, size) {
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Draw background circle
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 1, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw CT text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.4}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CT', size/2, size/2);
        }

        function generateFavicons() {
            const sizes = [16, 32, 48];
            const downloadLinks = document.getElementById('download-links');
            downloadLinks.innerHTML = '';

            sizes.forEach(size => {
                const canvas = document.getElementById(`canvas${size}`);
                const ctx = canvas.getContext('2d');
                
                drawCTLogo(ctx, size);
                
                // Create download link
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `favicon-${size}x${size}.png`;
                    link.textContent = `Download ${size}x${size} PNG`;
                    link.style.display = 'block';
                    link.style.margin = '5px 0';
                    downloadLinks.appendChild(link);
                });
            });
        }

        // Generate on load
        window.onload = function() {
            generateFavicons();
        };
    </script>
</body>
</html>
